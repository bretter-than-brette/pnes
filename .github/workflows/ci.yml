  win-x64:
    name: Windows (x64) (exe)
    needs: codegen-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download generated UI code
        uses: actions/download-artifact@v7
        with:
          name: demo-gen
          path: demo/gen

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Upgrade LLVM to meet the MSVC STL's clang floor
        shell: cmd
        run: choco upgrade llvm -y --no-progress

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-win-x64-release
          key: win-x64-v3-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: win-x64-v3-

      - name: Build demo
        shell: cmd
        run: |
          "C:/Program Files/LLVM/bin/clang.exe" --version
          cmake --preset win-x64-release -B cmake-build-win-x64-release -DCMAKE_C_COMPILER="C:/Program Files/LLVM/bin/clang.exe" -DCMAKE_CXX_COMPILER="C:/Program Files/LLVM/bin/clang++.exe"
          cmake --build cmake-build-win-x64-release -j

      - uses: actions/upload-artifact@v7
        with:
          name: demo-windows-x64
          path: |
            cmake-build-win-x64-release/demo.exe
