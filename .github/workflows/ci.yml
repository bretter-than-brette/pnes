      - uses: actions/checkout@v7

      - name: Download generated UI code
        uses: actions/download-artifact@v7
        with:
          name: demo-gen
          path: demo/gen

      - name: Install build tools
        run: brew install ninja

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-mac-arm64-release
          key: mac-arm64-v1-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: mac-arm64-v1-

      - name: Build demo
        run: |
          cmake --preset mac-arm64-release -B cmake-build-mac-arm64-release
          cmake --build cmake-build-mac-arm64-release -j"$(sysctl -n hw.ncpu)"

      - uses: actions/upload-artifact@v7
        with:
          name: demo-macos-arm64
          path: |
            cmake-build-mac-arm64-release/demo
            cmake-build-mac-arm64-release/tracks
            cmake-build-mac-arm64-release/sfx
          if-no-files-found: error

