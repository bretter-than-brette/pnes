  build-wiiu:
    build:
      context: docker
      dockerfile: Dockerfile.wiiu
    image: pnes-wiiu:latest
    user: "${UID:-0}:${GID:-0}"
    working_dir: /tmp/pnes
    volumes:
      - .:/tmp/pnes
    environment:
      PRESET: ${PRESET:-wiiu-release}
      HOME: /tmp
      WIIU_COMMON_KEY: ${WIIU_COMMON_KEY:-}
    command:
      - bash
      - -c
      - |
        set -euo pipefail
