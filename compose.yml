  build-ps2:
    build:
      context: docker
      dockerfile: Dockerfile.ps2
    image: pnes-ps2:latest
    network_mode: host
    user: "${UID:-0}:${GID:-0}"
    working_dir: /tmp/pnes
    volumes:
      - .:/tmp/pnes
    environment:
      PRESET: ${PRESET:-ps2-release}
      HOME: /tmp
    command:
      - sh
      - -c
      - |
        set -eu
        cmake --preset "$$PRESET" -B "cmake-build-ci-$$PRESET" -DALTERNATIVE_NAMETABLE=1
        cmake --build "cmake-build-ci-$$PRESET" -j"$$(nproc)"
