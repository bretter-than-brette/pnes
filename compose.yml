# Cross-platform build entry point. Run from the repository root in any shell:
#
#   docker compose run --rm build-nes      # NES ROM
#   docker compose run --rm build-linux    # Linux desktop demo
#   ...one service per target, see below
#
# Override the preset with PRESET in the environment. The Linux image also
# carries the i386 and arm64 multiarch packages the 32-bit and arm64 builds need.

services:
  build-nes:
    build:
      context: docker
      dockerfile: Dockerfile.nes
    image: pnes-nes:trixie
    user: "${UID:-0}:${GID:-0}"
    working_dir: /tmp/pnes
    volumes:
      - .:/tmp/pnes
    environment:
      PRESET: ${PRESET:-nes-release}
      HOME: /tmp
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        cmake --preset "$$PRESET" -B "cmake-build-ci-$$PRESET" \
          -DCMAKE_TOOLCHAIN_FILE="$$LLVM_MOS_SDK/lib/cmake/llvm-mos-sdk/llvm-mos-toolchain.cmake" \
          -DCMAKE_PREFIX_PATH="$$LLVM_MOS_SDK" \
          -DTOPLEVEL_LD=/tmp/pnes/demo/link.ld \
          -DPNES_AUDIO_SECTION=.prg_rom_audio \
          -DPNES_UI_SECTION=.prg_rom_cold \
          -DTITLE=.prg_rom_cold \
          -DSYSMEM=.sysmem \
          -DSAVE_FILE=1 \
          -DALTERNATIVE_NAMETABLE=1
        cmake --build "cmake-build-ci-$$PRESET" -j"$$(nproc)"
        echo "Built: cmake-build-ci-$$PRESET/demo.nes"

  build-linux:
    build:
      context: docker
      dockerfile: Dockerfile.linux
    image: pnes-linux:bullseye
    user: "${UID:-0}:${GID:-0}"
    working_dir: /tmp/pnes
    volumes:
      - .:/tmp/pnes
    environment:
      PRESET: ${PRESET:-linux-release}
      HOME: /tmp
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        cmake --preset "$$PRESET" -B "cmake-build-ci-$$PRESET" -DALTERNATIVE_NAMETABLE=1
        cmake --build "cmake-build-ci-$$PRESET" -j"$$(nproc)"
        echo "Built: cmake-build-ci-$$PRESET/demo"

  build-gc:
    build:
      context: docker
      dockerfile: Dockerfile.ogc
    image: pnes-ogc:latest
    user: "${UID:-0}:${GID:-0}"
    working_dir: /tmp/pnes
