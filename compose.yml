        cmake --preset "$$PRESET" -B "cmake-build-ci-$$PRESET" -DALTERNATIVE_NAMETABLE=1
        cmake --build "cmake-build-ci-$$PRESET" -j"$$(nproc)"
        echo "Built: cmake-build-ci-$$PRESET/demo.3dsx"

  build-switch:
    build:
      context: docker
      dockerfile: Dockerfile.switch
    image: pnes-switch:latest
    user: "${UID:-0}:${GID:-0}"
    working_dir: /tmp/pnes
    volumes:
      - .:/tmp/pnes
